name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: pipeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipeline"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://pipeline:ci-only-password@localhost:5432/pipeline
      REQUIRE_DB: "1"  # DB tests must run in CI, never skip
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans the full history

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest --ignore=tests/test_evals.py

      - name: Eval against the baseline (fake model, D-043)
        run: uv run pytest tests/test_evals.py

      - name: README scorecard matches the saved eval results (D-044)
        run: uv run python -m evals.scorecard --check

      - name: Secret scan
        run: uv run pre-commit run gitleaks-history --hook-stage manual --all-files
