[project]
name = "messy-data-reconciliation-pipeline"
version = "0.1.0"
description = "Extract, validate and reconcile messy multi-format data into a clean, traceable store using an LLM."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pdfplumber>=0.11",
    "pypdf>=5.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "anthropic>=1.13.0",
    "rapidfuzz>=3.9",
]

[dependency-groups]
# Only the synthetic-data generator needs these.
gen = [
    "reportlab>=4.2",
    "pillow>=11.0",
    "numpy>=2.1",
    "pypdfium2>=4.30",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-openpyxl",
    "types-reportlab",
]

[tool.uv]
default-groups = ["gen", "dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline", "data_gen"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PTH"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "data_gen", "tests", "evals"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "docx.*", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: generates the full corpus (seconds, not milliseconds)",
]
